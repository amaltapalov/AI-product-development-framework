  <script>
    /* Apply the saved theme before first paint to avoid a flash */
    (function () {
      try {
        var t = JSON.parse(localStorage.getItem('cadf.theme.v1') || 'null');
        if (t === 'dark' || (t === null && matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.classList.add('dark');
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="styles.css">
